<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>menu snapshot harness</title>
<style>html,body{margin:0;height:100%;background:#2b2b2b}</style>
</head>
<body>
<script>window.HGMENU_WINDOW_MODE = true</script>
<script src="../animals.js"></script>
<script src="../battle/units.js"></script>
<script src="../battle/art.js"></script>
<script src="../battle/gacha.js"></script><!-- 하네스 전용: 스냅샷 소스(실제 메뉴 창은 로드 안 함) -->
<script src="./menu-ui.js"></script>
<script>
// ─── 오버레이(app.js) 쪽 의존물 스텁 ───────────────────────────────────────
window.__ERRORS = []
window.onerror = (m, s, l) => { window.__ERRORS.push(m + ' @' + l) }
const APPEAR_DEFAULTS = { skin: 'default', hat: 'none', ear: 'round', eye: 'round', mouth: 'smile', hand: 'round', kb: 'dark', mouse: 'white', desk: 'wood' }
const SLOT_FIXED = ['missile','shield','ant','blackhole','gatling','human','lightning','net','bomber','broodTitan']
const ownedAppear = new Set(['hat:crown','eye:fire','kb:fire','skin:panda'])
const appearCounts = { 'hat:crown': 3, 'eye:fire': 2, 'kb:fire': 1, 'skin:panda': 2 }
function appearPool() {
  const A = window.AnimalArt
  const groups = [['skin',(A.SKIN_PRESETS||[]).map(p=>p.id)],['hat',A.HATS],['ear',A.EAR_SHAPES],['eye',A.EYE_SHAPES],['mouth',A.MOUTH_SHAPES],['hand',A.HAND_SHAPES],['kb',A.KB_ORDER],['mouse',A.MOUSE_ORDER],['desk',A.DESK_ORDER]]
  const out = []
  for (const [group, vals] of groups) for (const v of (vals||[])) if (APPEAR_DEFAULTS[group] !== v) out.push({ group, value: v })
  return out
}
const peers = new Map([[7, { id: 7, name: '친구곰' }]])
const G0 = window.BattleGacha, D = window.BattleData
// 실제 MENU_BRIDGE의 반환 "모양"을 그대로 흉내낸 스텁
const MENU_BRIDGE = {
  isDev: () => false, isConnected: () => true, getServer: () => 'ws://localhost:8787', isHost: () => true,
  getRoster: () => [{ name: '나', me: true, host: true }, { id: 7, name: '친구곰' }],
  isPeerLocked: (pid) => pid === 7,
  roomInfo: () => ({ connected: true, me: { name: '나', wins: 2, plays: 5 }, peers: [{ id: 7, name: '친구곰', wins: 1, plays: 4 }] }),
  getPeersDim: () => true, getDesktopMode: () => false, getDevCoinMode: () => null, getDevBeam: () => false,
  getFps: () => 60, getKeybinds: () => ({ mod: 'alt', keys: ['Z','X','C'] }),
  getAchievements: () => [{ icon: '🥁', title: '누적 비트 카운트', reward: '🟡 3', cur: 1200, goal: 50000, cleared: 0, done: false }],
  getAppearance: () => ({ skin: 'default', hat: 'crown', shape: { ear:'round', eye:'fire', mouth:'smile', hand:'round', body:'plain', tail:'stub' }, deskStyle: 'wood', kbStyle: 'fire', mouseStyle: 'white' }),
  appearOwned: (g, v) => APPEAR_DEFAULTS[g] === v || ownedAppear.has(g + ':' + v),
  appearCount: (g, v) => appearCounts[g + ':' + v] || 0,
  gachaCoins: () => ({ paw: 12, grizzle: 4 }),
  gachaPool: (kind) => {
    if (kind === 'appear') return appearPool().map(it => ({ group: it.group, value: it.value, owned: MENU_BRIDGE.appearOwned(it.group, it.value) }))
    return G0.catalog().filter(e => !e.starter && ((D.RARITY[e.rarity]||{}).weight||0) > 0)
      .map(e => ({ id: e.id, name: e.name||e.id, rarity: e.rarity, color: (e.rarityInfo||{}).color||'#c9a074', owned: e.owned }))
  },
  gachaOdds: () => { const t = Object.values(D.RARITY).filter(r=>r.weight>0), tot = t.reduce((s,r)=>s+r.weight,0)
    return t.map(r => ({ key: r.key, name: r.name, color: r.color, pct: Math.round(r.weight/tot*1000)/10 })) },
  craftMats: (kind) => {
    if (kind === 'appear') return appearPool().filter(it => MENU_BRIDGE.appearCount(it.group,it.value) > 0).map(it => ({ group: it.group, value: it.value, count: MENU_BRIDGE.appearCount(it.group,it.value) }))
    return G0.catalog().filter(e => (e.count||0) > 0).map(e => ({ id: e.id, name: e.name||e.id, rarity: e.rarity, color: (e.rarityInfo||{}).color||'#c9a074', count: e.count }))
  },
  weaponSlots: () => ({ keys: ['Alt+Z','Alt+X','Alt+C'], slots: ['missile','ant','none'] }),
  slotEligible: (id) => SLOT_FIXED.includes(id),
  slotUsable: (id) => id === 'none' || id === 'missile' || G0.isOwned(id),
}
</script>
<script>
// ─── app.js의 진짜 buildMenuSnap 소스를 그대로 가져와 실행 ────────────────
async function run() {
  const src = await (await fetch('../app.js')).text()
  const i = src.indexOf('  function buildMenuSnap() {')
  const j = src.indexOf('\n  let snapPushing', i)
  if (i < 0 || j < 0) { document.title = 'EXTRACT FAIL'; window.__ERRORS.push('buildMenuSnap 추출 실패'); return }
  const body = src.slice(i, j)
  const build = new Function('MENU_BRIDGE','appearPool','APPEAR_DEFAULTS','SLOT_FIXED','peers', body + '\n; return buildMenuSnap')(MENU_BRIDGE, appearPool, APPEAR_DEFAULTS, SLOT_FIXED, peers)
  const SNAP = JSON.parse(JSON.stringify(build()))
  window.__SNAP = SNAP

  window.__ACTIONS = []
  window.beatbearMenu = {
    onInit: (cb) => { window.__init = cb },
    onSnap: (cb) => { window.__onSnap = cb },
    onClose: (cb) => { window.__onClose = cb },
    action: (fn, args) => { window.__ACTIONS.push({ fn, args }) },
    invoke: (fn, args) => { window.__ACTIONS.push({ fn, args })
      return Promise.resolve(fn === 'rollGacha' ? [{ id: 'ant', name: '개미', rarity: 'common', color: '#c9a074', dup: true, count: 2 }] : { ok: false, reason: 'harness' }) },
    close: () => { window.__CLOSED = true }
  }
  await new Promise((r) => { const s = document.createElement('script'); s.src = './menu-bridge.js'; s.onload = r; document.body.appendChild(s) })
  window.__init({ snap: SNAP })
  document.title = 'harness ready'
}
run()
// 카테고리 순회 검사 — 모든 레일/탭을 눌러보고 던지는 곳이 있는지
window.__sweep = function () {
  const out = []
  const pop = document.querySelector('.hgm-pop')
  const rails = [...pop.querySelectorAll('.hgm-rbtn')]
  for (let ri = 0; ri < rails.length; ri++) {
    const before = window.__ERRORS.length
    pop.querySelectorAll('.hgm-rbtn')[ri].click()
    const tabs = [...pop.querySelectorAll('.hgm-tb')]
    const name = pop.querySelectorAll('.hgm-rbtn')[ri].dataset.tip
    if (!tabs.length) { out.push({ cat: name, tab: '-', cells: pop.querySelectorAll('.hgm-ct *').length, err: window.__ERRORS.length - before }) }
    for (let ti = 0; ti < tabs.length; ti++) {
      const b2 = window.__ERRORS.length
      pop.querySelectorAll('.hgm-tb')[ti].click()
      out.push({ cat: name, tab: pop.querySelectorAll('.hgm-tb')[ti].dataset.tip, cells: pop.querySelectorAll('.hgm-ct *').length, err: window.__ERRORS.length - b2 })
    }
  }
  return out
}
</script>
</body>
</html>
